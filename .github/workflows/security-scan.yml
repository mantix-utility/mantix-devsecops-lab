name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  inspector-scan:
    name: Amazon Inspector Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Autenticarse contra AWS mediante OIDC
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::523835807940:role/GitHubActions-InspectorScan
          aws-region: us-east-1

      # 3. Verificar la identidad asumida en AWS
      - name: Verify AWS identity
        run: aws sts get-caller-identity
        
      - name: Test Inspector SAST findings access
        run: |
          aws inspector2 list-findings \
            --filter-criteria '{
              "findingStatus":[{"comparison":"EQUALS","value":"ACTIVE"}],
              "severity":[
                {"comparison":"EQUALS","value":"HIGH"},
                {"comparison":"EQUALS","value":"CRITICAL"}
              ]
            }' \
            --region us-east-1
       

      # 4. Generar SBOM y analizar el repositorio con Amazon Inspector
      - name: Amazon Inspector vulnerability scan
        id: inspector
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@v1
        with:
          artifact_type: repository
          artifact_path: ./
          display_vulnerability_findings: enabled

          # Por ahora solo medimos.
          # Todavía NO bloquearemos el pipeline.
          critical_threshold: 1
          high_threshold: 1
          medium_threshold: 0
          low_threshold: 0
          other_threshold: 0

      # 5. Mostrar si alguno de los thresholds fue alcanzado
      - name: Enforce security gate
        run: |
          echo "======================================"
          echo " Amazon Inspector Security Gate"
          echo "======================================"

          if [ "${{ steps.inspector.outputs.vulnerability_threshold_exceeded }}" = "1" ]; then
            echo "SECURITY GATE FAILED"
            echo "Critical or High vulnerabilities exceeded the allowed threshold."
            exit 1
          fi

          echo "SECURITY GATE PASSED"

      # 6. Guardar SBOM y resultados del análisis
      - name: Upload Inspector scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-inspector-results
          path: |
            ${{ steps.inspector.outputs.artifact_sbom }}
            ${{ steps.inspector.outputs.inspector_scan_results }}
            ${{ steps.inspector.outputs.inspector_scan_results_csv }}
            ${{ steps.inspector.outputs.inspector_scan_results_markdown }}
            
