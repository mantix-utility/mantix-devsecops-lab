name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ==========================================================
  # SCA - Software Composition Analysis
  # Amazon Inspector scans dependencies / SBOM
  # ==========================================================
  sca-security:
    name: SCA Security Gate
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # 1. Checkout repository
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. Authenticate to AWS using GitHub OIDC
      # -------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::523835807940:role/GitHubActions-InspectorScan
          aws-region: us-east-1

      # -------------------------------------------------------
      # 3. Validate AWS identity
      # -------------------------------------------------------
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # -------------------------------------------------------
      # 4. Generate SBOM and scan dependencies with
      #    Amazon Inspector
      # -------------------------------------------------------
      - name: Amazon Inspector SCA Scan
        id: inspector
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@v1
        with:
          artifact_type: repository
          artifact_path: ./

          display_vulnerability_findings: enabled

          # Security policy
          #
          # Critical >= 1 -> BLOCK
          # High >= 1     -> BLOCK
          # Medium        -> Report only
          # Low           -> Report only

          critical_threshold: 1
          high_threshold: 1
          medium_threshold: 0
          low_threshold: 0
          other_threshold: 0

      # -------------------------------------------------------
      # 5. Evaluate SCA Security Gate
      # -------------------------------------------------------
      - name: Evaluate SCA Security Gate
        run: |
          echo "======================================"
          echo " Amazon Inspector SCA Security Gate"
          echo "======================================"

          if [ "${{ steps.inspector.outputs.vulnerability_threshold_exceeded }}" = "1" ]; then
            echo "SCA SECURITY GATE FAILED"
            echo "Vulnerability findings exceeded the configured security threshold."
            exit 1
          fi

          echo "SCA SECURITY GATE PASSED"

      # -------------------------------------------------------
      # 6. Upload Inspector reports
      # -------------------------------------------------------
      - name: Upload Inspector scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-inspector-sca-results
          path: |
            inspector_scan_*.json
            inspector_scan_*.csv
            inspector_scan_*.md
            inspector_dockerfile_scan_*.csv
            inspector_dockerfile_scan_*.md
            inspector_malware_scan_*.md
          if-no-files-found: ignore
